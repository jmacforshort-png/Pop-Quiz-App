<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pop Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <p class="kicker">Pop Quiz Portal</p>
        <h1>Pop Quiz</h1>
        <p class="subtitle">Sign in to your account or create a student account by block.</p>
      </header>

      <section class="card auth-layout">
        <div class="auth-card">
          <h2>Log In</h2>
          <form id="login-form" class="auth-form">
            <label>
              Username
              <input id="login-username" type="text" autocomplete="username" required />
            </label>
            <label>
              Password
              <input id="login-password" type="password" autocomplete="current-password" required />
            </label>
            <button class="btn primary" type="submit">Log In</button>
          </form>
        </div>

        <div class="auth-card">
          <h2>Create Student Account</h2>
          <form id="signup-form" class="auth-form">
            <label>
              Username
              <input id="signup-username" type="text" autocomplete="username" required />
            </label>
            <label>
              Password (6+ characters)
              <input id="signup-password" type="password" autocomplete="new-password" required />
            </label>
            <label>
              Block Number
              <select id="signup-block" required></select>
            </label>
            <button class="btn secondary" type="submit">Create Account</button>
          </form>
        </div>
      </section>

      <p id="auth-message" class="subtitle" aria-live="polite"></p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
