<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pop Quiz Take Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="student.css" />
  </head>
  <body>
    <main class="app student-app">
      <header class="hero">
        <p class="kicker">Student Panel</p>
        <h1 id="student-quiz-title">Take Quiz</h1>
        <p id="student-quiz-description" class="subtitle"></p>
        <p id="student-window-message" class="subtitle"></p>
        <div class="row-actions">
          <a href="student.html">Back to available quizzes</a>
          <button id="student-logout" type="button" class="btn secondary">Log Out</button>
        </div>
      </header>
      <section class="card">
        <div id="submission-confirmation" class="student-quiz-item" hidden>
          <h2>Submission Received</h2>
          <p id="submission-confirmation-text" class="subtitle"></p>
        </div>
        <div id="student-quiz-questions" class="student-list"></div>
        <div class="row-actions">
          <button id="submit-student-quiz" class="btn primary" type="button" disabled>
            Submit Quiz
          </button>
        </div>
        <p id="student-quiz-message" class="form-message" aria-live="polite"></p>
      </section>
    </main>
    <script src="student-quiz.js"></script>
  </body>
</html>
